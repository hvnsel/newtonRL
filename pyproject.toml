[project]
name = "luna_hifi_tasks"
version = "0.1.0"
description = "Isaac Lab tasks for a lunar regolith excavator: navigate and excavate, plus a tricycle demo"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# play --video; install into the Isaac Lab venv:
#   uv pip install --python <isaaclab>/.venv/bin/python 'moviepy<2'
video = ["moviepy<2"]

[project.entry-points."isaaclab.tasks"]
"luna_hifi_tasks" = "luna_hifi_tasks"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["luna_hifi_tasks*"]
