[project]
name = "luna_hifi_tasks"
version = "0.1.0"
description = "Isaac Lab tricycle task: articulated vehicle on Newton implicit-MPM soil"
requires-python = ">=3.11"
dependencies = []

# scripts/check_excavator.py validates the excavator geometry offline and needs
# MuJoCo but deliberately NOT Isaac Lab, so it runs wherever you are editing
# excavator.py.
[project.optional-dependencies]
assets = ["mujoco>=3.1.6"]      # 3.1.6 is where mj_geomDistance lands

[project.entry-points."isaaclab.tasks"]
"luna_hifi_tasks" = "luna_hifi_tasks"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["luna_hifi_tasks*"]
